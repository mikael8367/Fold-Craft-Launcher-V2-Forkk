name: Build APK now

on:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assemblefordebug -Darch=arm64 --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fold-craft-v2-arm64-debug
          path: FCL/build/outputs/apk/*/*
          if-no-files-found: error
