name: Build APK now

# The push trigger is temporarily limited to the performance tuning source file
# so the explicitly requested APK is built once. Restore workflow_dispatch-only
# after the triggering commit; future pushes must not build APKs automatically.
on:
  push:
    paths:
      - 'FCL/src/main/java/com/tungsten/fcl/game/PerformanceRuntimeTuning.java'
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assemblefordebug -Darch=arm64 --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fold-craft-v2-arm64-debug
          path: FCL/build/outputs/apk/*/*
          if-no-files-found: error
